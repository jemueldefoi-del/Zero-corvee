# Récupère les chiffres de visites GoatCounter (lancé par Claude à 7h et 22h).
# Le résultat est publié sur la branche stats-data (lisible via l'API GitHub).
name: stats-visites
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Lire GoatCounter
        env:
          TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          set +e
          mkdir -p out
          echo debut > out/codes.txt
          if [ -z "$TOKEN" ]; then echo "secret GOATCOUNTER_TOKEN absent" > out/erreur.txt; exit 0; fi
          API=https://zerocorvee.goatcounter.com/api/v0
          today=$(TZ=Europe/Paris date +%F)
          d7=$(TZ=Europe/Paris date -d '-6 days' +%F)
          d30=$(TZ=Europe/Paris date -d '-29 days' +%F)
          m1=$(TZ=Europe/Paris date +%Y-%m-01)
          get() { code=$(curl -sS -o "out/$1" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$API/$2" 2>>out/curl-erreurs.txt) || true; echo "$1 $code" >> out/codes.txt; }
          get me.json "me"
          get total30.json "stats/total?start=${d30}T00:00:00Z&end=${today}T23:59:59Z"
          get mois.json "stats/total?start=${m1}T00:00:00Z&end=${today}T23:59:59Z"
          get pages7.json "stats/hits?start=${d7}T00:00:00Z&end=${today}T23:59:59Z&limit=10"
          get sources7.json "stats/toprefs?start=${d7}T00:00:00Z&end=${today}T23:59:59Z&limit=10"
          echo "$today" > out/date.txt
      - name: Enregistrer sur la branche stats-data
        if: always()
        run: |
          mkdir -p out && cd out
          rm -f me.json
          git init -q -b stats-data
          git config user.name "jemueldefoi-del"
          git config user.email "jemueldefoi@users.noreply.github.com"
          git add -A && git commit -qm "stats $(date -u +%FT%TZ)" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats-data
